name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas de host
        run: make -f Makefile.host test
      - name: Comprobar herramientas Python
        run: python3 -m py_compile tools/*.py

  # La imagen kazade/dreamcast-sdk trae una KallistiOS anterior a la que usa el
  # port (pvr_scene_begin_rtt, pvr_dr_target sin estado, snd_sfx_play_ex con
  # bucles, cabeceras de fs_vmu...), asi que este job solo se lanza a mano
  # (Actions > build > Run workflow) hasta tener una imagen con KOS reciente.
  dreamcast:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: kazade/dreamcast-sdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con KallistiOS
        shell: bash
        run: |
          source /opt/toolchains/dc/kos/environ.sh
          make
      - uses: actions/upload-artifact@v4
        with:
          name: cruisn-usa-dc-elf
          path: cruisn-usa-dc.elf
